<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="todo-container">
        <div class="add-task-box">
            <input type="text" id="taskInput" placeholder="Add a new task">
            <button id="addBtn" class="add-btn">+</button>
        </div>
        <div class="tasks-section">
            <h3 id="todoTitle" class="section-title">Tasks to do - 4</h3>
            
            <div id="todoContainer">
                <div class="task-item">
                    <span class="task-text">To study React fundamentals</span>
                    <div class="task-actions">
                        <button class="check-btn" title="Mark as Done">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                        <button class="delete-btn" title="Delete Task">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="task-item">
                    <span class="task-text">To study React fundamentals</span>
                    <div class="task-actions">

                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="task-item">
                    <span class="task-text">To study React fundamentals</span>
                    <div class="task-actions">
                        <button class="check-btn" title="Mark as Done">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">

                            </svg>
                        </button>
                    </div>
                </div>
                <div class="task-item">
                    <span class="task-text">To study React fundamentals</span>
                    <div class="task-actions">
                        <button class="check-btn" title="Mark as Done">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>

                                <polyline points="3 6 5 6 21 6"></polyline>

                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="done-section">
            <h3 id="doneTitle" class="section-title">Done - 1</h3>
            
            <div id="doneContainer">
                <div class="task-item completed">
                    <span class="task-text completed-text">To study React fundamentals</span>
                </div>
            </div>
        </div>
    </div>
    <script src="./js/ToDoList.js"></script>
</body>
</html>
